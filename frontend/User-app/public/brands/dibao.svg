    <circle cx="0" cy="-2" r="3" fill="#e61c38"/>
  </g>
  <text x="60" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="2.5" text-anchor="middle">DIBAO</text>
</svg>
