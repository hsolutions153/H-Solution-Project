<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="yd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea1d24"/>
      <stop offset="100%" stop-color="#b80c12"/>
    </linearGradient>
    <linearGradient id="yd-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="yd-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#yd-bg)"/>
  <g transform="translate(60, 52)" filter="url(#yd-shadow)">
    <!-- Yadea Iconic Triangular Geometric Emblem -->
    <!-- Top central node -->
    <path d="M 0,-24 L 20,12 L 0,6 L -20,12 Z" fill="url(#yd-chrome)"/>
    <!-- Left wing polygon -->
    <path d="M -23,15 L -2,8 L -14,24 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Right wing polygon -->
    <path d="M 23,15 L 2,8 L 14,24 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Inner faceted geometry -->
    <polygon points="0,-16 11,8 0,4" fill="#cbd5e1"/>
    <polygon points="0,-16 -11,8 0,4" fill="#ffffff"/>
  </g>
  <text x="60" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="2.5" text-anchor="middle">YADEA</text>
</svg>
