<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="honda-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea0029"/>
      <stop offset="100%" stop-color="#b0001e"/>
    </linearGradient>
    <filter id="honda-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#honda-bg)"/>
  <g transform="translate(60, 48)" filter="url(#honda-shadow)">
    <!-- Honda Classic Motorcycle Wing Emblem -->
    <!-- Feather Layer 1 (Top) -->
    <path d="M -30,-8 C -22,-20 0,-24 30,-22 C 30,-22 18,-14 6,-14 C -6,-14 -16,-12 -30,-8 Z" fill="#ffffff"/>
    <!-- Feather Layer 2 (Middle) -->
    <path d="M -26,-2 C -18,-12 4,-14 26,-13 C 26,-13 14,-6 4,-6 C -6,-6 -14,-4 -26,-2 Z" fill="#ffffff"/>
    <!-- Feather Layer 3 (Bottom) -->
    <path d="M -22,4 C -14,-4 6,-6 22,-5 C 22,-5 12,1 2,1 C -6,1 -12,2 -22,4 Z" fill="#ffffff"/>
    <!-- Wing Base Arch -->
    <path d="M -18,10 C -10,3 6,2 18,3 C 14,8 4,10 -2,10 C -8,10 -13,9 -18,10 Z" fill="#ffffff"/>
    <path d="M -14,15 C -4,11 6,11 14,13 C 8,16 0,16 -6,16 C -10,16 -12,15 -14,15 Z" fill="#ffffff"/>
  </g>
  <text x="60" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="2.5" text-anchor="middle">HONDA</text>
</svg>
